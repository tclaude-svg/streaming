# Rebuilds the live site when staff have changed games in the database, so new game pages
# get their own link preview and calendar file. Does nothing until the three repository
# secrets below exist (Settings > Secrets and variables > Actions). See docs/ADMIN.md.
name: Rebuild when games change

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes; a build only starts when something changed
  workflow_dispatch: {}       # "Run workflow" button for a manual check

permissions:
  contents: read

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-rebuild.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
